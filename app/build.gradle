plugins { id 'com.android.application' }
android {
    namespace 'local.money'
    compileSdk 35
    defaultConfig {
        applicationId 'local.money'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.13.0'
    }
    signingConfigs {
        debug {
            if (System.getenv('MONEY_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MONEY_KEYSTORE_PATH'))
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


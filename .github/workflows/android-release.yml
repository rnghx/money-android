name: Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONEY_KEYSTORE_PATH: /tmp/money-signing.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate business logic
        run: node --test tests/*.test.js
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: 'false'
      - name: Restore original signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MONEY_KEYSTORE_PATH"
          chmod 600 "$MONEY_KEYSTORE_PATH"
      - name: Build and lint
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloud-release.cjs
      - name: Remove signing material
        if: always()
        run: rm -f "$MONEY_KEYSTORE_PATH"
